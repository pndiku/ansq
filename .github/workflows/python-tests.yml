name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.nsq-version }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os:
          - Ubuntu
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        nsq-version:
          - "nsq-1.3.0.linux-amd64.go1.21.5"
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      PY_COLORS: 1
      PYTEST_ADDOPTS: --cov-report=xml
    steps:
      - uses: actions/checkout@master
      - name: Download NSQ
        run: |
          curl -sSL "https://github.com/nsqio/nsq/releases/download/v1.3.0/${{matrix.nsq-version}}.tar.gz" \
                    | tar -xzv --strip-components=1
          ./bin/nsqd --version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install tox-gh-actions
      - name: Prepare test environment
        run: tox --notest
      - name: Test
        run: |
          export PATH=bin:$PATH
          tox -e py${PYTHON_VERSION//./}-cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          name: ${{ runner.os }}-${{ matrix.python-version }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
