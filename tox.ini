[tox]
envlist =
    py3{12,13,14}-cov
    cov
    lint
skip_missing_interpreters = True

[testenv]
extras =
    testing
    cov: coverage
setenv =
    cov: PYTEST_ADDOPTS=--strict --cov --cov-report=term-missing {env:PYTEST_ADDOPTS:}
commands =
    pytest {posargs}

[testenv:lint]
basepython = python3
skip_install = True
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
